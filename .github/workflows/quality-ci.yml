name: Quality CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[testing,dev]"
      - name: Ruff
        run: python -m ruff check src/api src/services src/server.py tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[testing,dev]"
      - name: Mypy
        run: python -m mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[testing,dev]"
      - name: Build UI artifacts for tests
        run: |
          mkdir -p ui/dist/assets
          printf '<html><body><script src="/assets/app.js"></script></body></html>' > ui/dist/index.html
          printf 'console.log("test");\n' > ui/dist/assets/app.js
      - name: Pytest with coverage
        run: |
          python -m pytest tests/ -v \
            --cov=src/api --cov=src/services --cov=src/server.py \
            --cov-report=term-missing --cov-report=xml --cov-fail-under=50
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
