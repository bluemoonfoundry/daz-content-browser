[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-asset-browser"
version = "1.1.0"
authors = [
  { name="G.Hirpara", email="gshirpara@gmail.com" },
]
description = "A semantic search and browser for DAZ Studio 3D asset libraries."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic",
    "chromadb",
    "python-dotenv",
    "rich",
    "huggingface-hub",
    "requests",
    "aiohttp",
    "psycopg2-binary",
    "beautifulsoup4",
    "lxml",
    "numpy==2.3.0",
]

[project.optional-dependencies]

local_llm = [
    "torch",                  # CPU build by default; see README for CUDA install
    "transformers",
    "accelerate",
    "bitsandbytes",
    "sentence-transformers",
    "datasets",
    "einops",
]

openai = [
    "openai",
]

all_llms = [
    "visual-asset-browser[local_llm]",
    "visual-asset-browser[openai]",
]

build = [
    "build",
    "pyinstaller",
]

testing = [
    "pytest",
    "httpx",
]

[project.scripts]
vab = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = { find = { where = ["src"] } }

[tool.setuptools.package-data]
"*" = ["ui_dist/**/*"]
