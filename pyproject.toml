[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-asset-browser"
version = "1.0.0"
authors = [
  { name="G.Hirpara", email="gshirpara@gmail.com" },
]
description = "A semantic search and browser for DAZ Studio 3D asset libraries."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic",
    "chromadb",
    "python-dotenv",
    "rich",
    "huggingface-hub",
    "requests",
    "psycopg2-binary",
    "beautifulsoup4",
    "lxml",
    "numpy==2.3.0",
]

[project.optional-dependencies]

local_llm = [
    "torch",                  # CPU build by default; see README for CUDA install
    "transformers",
    "accelerate",
    "bitsandbytes",
    "sentence-transformers",
    "datasets",
    "einops",
]

openai = [
    "openai",
]

all_llms = [
    "visual-asset-browser[local_llm]",
    "visual-asset-browser[openai]",
]

build = [
    "build",
    "pyinstaller",
]

testing = [
    "pytest>=8.2,<9.0",
    "pytest-cov>=5.0,<6.0",
    "httpx>=0.27,<1.0",
]

dev = [
    "ruff>=0.6,<1.0",
    "mypy>=1.10,<2.0",
    "types-requests>=2.32.0.20240914,<3.0",
]

[project.scripts]
vab = "main:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = { find = { where = ["src"] } }

[tool.setuptools.package-data]
"*" = ["ui_dist/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["ui/src", "ui/dist", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = true
files = ["src/api", "src/services", "src/server.py"]

[tool.pytest.ini_options]
addopts = "--ignore=tests/test_api.py"

[tool.coverage.run]
source = ["src/api", "src/services", "src/server.py"]
branch = true

[tool.coverage.report]
fail_under = 50
show_missing = true
skip_empty = true
